
<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Horária de Aulas do Módulo</title>
</head>

<body>

    <main>

        <!-- MÓDULO 5: HORÁRIOS DAS AULAS -->
        <section class="bloco-cronograma">

            <h1 class="titulo-seccao">Horários acadêmicos</h1>

            <table>
                <caption>Grade horária das aulas do módulo</caption>

                <thead>
                    <tr>
                        <th scope="col">Aula</th>
                        <th scope="col">Horário</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>Estruturação Multimídia</td>
                        <td>19:00 - 20:30</td>
                    </tr>
                </tbody>
            </table>

            <p>Recursos necessários:</p>

            <ul>
                <li>Computador com IDE configurada</li>
                <li>Arquivos de legenda (.vtt) prontos</li>
            </ul>

        </section>

        <hr>

        <!-- MÓDULO 6: CONTEÚDO INTEGRADO -->

        <section class="bloco-video">

            <h2>Apresentação da Disciplina</h2>

            <video controls>
                <source src="apresentacao.mp4" type="video/mp4">

                <track
                    src="legendas.vtt"
                    kind="captions"
                    srclang="pt"
                    label="Português"
                    default>

                Seu navegador não suporta a reprodução de vídeos.
            </video>

        </section>

        <section class="bloco-mapa">

            <h2>Localização do Campus IFF</h2>

            <iframe
                src="https://mapas.iff.edu.br"
                title="Mapa de localização do Campus IFF"
                sandbox="allow-scripts"
                loading="lazy"
                referrerpolicy="no-referrer">
            </iframe>

        </section>

    </main>

</body>
</html>
